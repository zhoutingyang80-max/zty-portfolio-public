<!doctype html>
<html lang="zh-CN">
<head>
    <script src="./assets/media-map.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work · v036 · Portfolio v371</title>
  <style>
    :root {
      --jm-bg: #f4f4f4;
      --jm-warm: #faf6ef;
      --jm-orange: #ffbc95;
      --jm-orange-2: #f99e76;
      --jm-blue: #2e54fe;
      --jm-grey: #96908c;
      --jm-ink: #313131;
      --jm-soft-line: rgba(49, 49, 49, .14);
      --jm-card: #ffffff;
      --jm-admin: #101010;
      --jm-admin-soft: #1d1d1d;
      --jm-admin-line: rgba(255,255,255,.12);
      font-family: "Arial Rounded MT Bold", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--jm-ink);
      background: var(--jm-bg);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      box-shadow: none;
    }
    a { color: inherit; text-decoration: none; }
    img, video { max-width: 100%; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      height: 80px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4vw;
      background: var(--jm-bg);
      border-bottom: 1px solid rgba(49,49,49,.08);
      pointer-events: none;
    }
    .brand-mark,
    .social-links,
    .center-nav { pointer-events: auto; }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      color: var(--jm-grey);
      font-size: .92rem;
      font-weight: 700;
    }
    .brand-dot {
      width: .45rem;
      height: .45rem;
      border-radius: 50%;
      background: var(--jm-blue);
      display: inline-block;
    }
    .center-nav {
      display: inline-flex;
      justify-self: center;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.56);
      border: 1px solid rgba(49,49,49,.08);
      box-shadow: 0 12px 40px rgba(49,49,49,.08);
      backdrop-filter: blur(12px);
    }
    .center-nav a,
    .center-logo {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border-radius: 999px;
      color: var(--jm-grey);
      font-size: .82rem;
      font-weight: 700;
    }
    .center-logo {
      width: 38px;
      padding: 0;
      color: var(--jm-blue);
      background: #fff;
      font-style: italic;
      font-size: 1.05rem;
      box-shadow: 0 10px 24px rgba(49,49,49,.08);
    }
    .center-nav a.is-active { color: #fff; background: rgba(150,144,140,.72); }
    .social-links {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      color: var(--jm-grey);
      font-size: .78rem;
      font-weight: 700;
    }

    .loader-strip {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      height: 8px;
      background: var(--jm-orange);
      transform-origin: left center;
      animation: introLine .9s ease both;
      pointer-events: none;
    }
    @keyframes introLine {
      0% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(0); opacity: 0; }
    }

    .work-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: flex-start;
      padding-top: 0;
    }
    .work-nav-rail {
      position: sticky;
      top: 0;
      z-index: 30;
      width: 13.6vw;
      min-width: 156px;
      height: 100vh;
      padding: 80px 0 6vh 4vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: var(--jm-grey);
    }
    .work-nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1.18rem;
      width: 100%;
    }
    .work-nav-item {
      position: relative;
      display: grid;
      grid-template-columns: 10px;
      gap: 0;
      align-items: center;
    }
    .work-nav-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      border: 0;
      background: currentColor;
      opacity: .5;
    }
    .work-nav-link {
      position: absolute;
      left: 18px;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--jm-grey);
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-4px);
      transition: color .18s ease, transform .18s ease, opacity .18s ease;
    }
    .work-nav-link:hover {
      color: var(--jm-ink);
      opacity: 1;
      transform: translateX(0);
    }
    .work-nav-link:hover + .nav-preview {
      opacity: 1;
      transform: translate(14px, -50%) scale(1);
    }
    .nav-preview {
      position: absolute;
      left: 100%;
      top: 50%;
      width: 130px;
      aspect-ratio: 1.38 / 1;
      border-radius: 6px;
      overflow: hidden;
      background: var(--jm-card);
      box-shadow: 0 20px 60px rgba(49,49,49,.18);
      opacity: 0;
      transform: translate(8px, -50%) scale(.96);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .nav-preview img,
    .nav-preview video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f4f4f4;
    }

    .work-main {
      position: relative;
      z-index: 2;
      width: 86.4vw;
      padding-right: 1.2vw;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .watermark {
      display: none;
    }
    .work-header {
      position: relative;
      min-height: 92vh;
      padding: 80px 4vw 0 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
    }
    .headline-wrap {
      position: relative;
      max-width: 84vw;
      min-height: 0;
      display: block;
    }
    .hero-title-line {
      display: block;
    }
    .headline-work {
      color: var(--jm-grey);
      margin: 0;
      font-size: clamp(5.2rem, 6.1vw, 8rem);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }
    .headline-work span {
      color: var(--jm-orange);
      opacity: .2;
    }
    .headline-work .folder-mark {
      color: inherit;
      opacity: 1;
    }
    .work-eyebrow,
    .cta-eyebrow {
      margin: 0 0 18px;
      color: var(--jm-grey);
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .folder-mark {
      position: relative;
      display: inline-block;
      vertical-align: middle;
      left: auto;
      bottom: auto;
      width: clamp(104px, 7.7vw, 156px);
      height: clamp(74px, 5.9vw, 98px);
      margin: 0 clamp(24px, 3vw, 44px) .08em 0;
      border-radius: 8px;
      background: var(--jm-blue);
      transform: none;
      box-shadow: 0 22px 55px rgba(46,84,254,.22);
    }
    .folder-mark::before {
      content: "";
      position: absolute;
      left: 10%;
      top: -19%;
      width: 42%;
      height: 30%;
      border-radius: 7px 7px 0 0;
      background: var(--jm-blue);
    }
    .folder-mark::after {
      content: "///";
      position: absolute;
      left: 34%;
      top: 38%;
      color: rgba(49,49,49,.22);
      font-size: clamp(1.6rem, 2vw, 2.35rem);
      font-weight: 700;
      transform: skew(-14deg);
    }
    .header-note {
      display: none;
      flex: 0 0 min(330px, 27vw);
      color: var(--jm-grey);
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.65;
      margin-bottom: 2.2vw;
    }

    .project-block {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-bottom: clamp(88px, 7.2vw, 148px);
      padding: clamp(58px, 5vw, 86px) clamp(6px, .45vw, 10px) clamp(6px, .45vw, 10px);
      background: var(--jm-card);
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 2.2vw, 42px);
      box-shadow: 0 1px 0 rgba(49,49,49,.04);
      scroll-margin-top: 96px;
    }
    .project-info-grid {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 1.22fr) minmax(240px, 1fr) minmax(190px, .9fr) minmax(260px, 1fr);
      gap: clamp(20px, 2.4vw, 52px);
      align-items: start;
      padding: 0 clamp(38px, 4.8vw, 88px);
    }
    .project-title-cell {
      display: grid;
      gap: .82rem;
      align-items: start;
    }
    .project-title {
      color: var(--jm-ink);
      margin: 0;
      font-size: clamp(1.75rem, 2.1vw, 2.45rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: 0;
    }
    .project-label {
      color: var(--jm-grey);
      margin: 0 0 .62rem;
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: .01em;
    }
    .project-label small {
      display: block;
      margin-top: .24rem;
      font-size: .58rem;
      line-height: 1;
      letter-spacing: .1em;
      opacity: .7;
    }
    .project-copy {
      color: var(--jm-ink);
      margin: 0;
      max-width: 38rem;
      font-size: .92rem;
      font-weight: 600;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    @media screen and (min-width: 769px) and (max-width: 1400px) {
      .project-info-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: clamp(34px, 4vw, 58px);
        row-gap: 26px;
      }
    }
    .pill-year,
    .pill-service {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 25px;
      border-radius: 999px;
      border: 1px solid rgba(49,49,49,.12);
      color: var(--jm-grey);
      background: #fff;
      padding: .38rem .65rem;
      font-size: .72rem;
      line-height: 1;
      font-weight: 700;
    }
    .pill-service {
      border-radius: 5px;
      border-color: rgba(46,84,254,.16);
      color: var(--jm-grey);
      margin: 0 .4rem .45rem 0;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-flow: row;
      grid-auto-rows: clamp(118px, 6.8vw, 140px);
      gap: 6px;
      width: 100%;
    }
    .media-card {
      position: relative;
      height: clamp(280px, 24vw, 440px);
      grid-column: span 4;
      min-height: 0;
      background: #f3f3f3;
      border-radius: 4px;
      overflow: hidden;
    }
    .media-card.is-page-feature {
      grid-column: span 12;
      grid-row: span 6;
      height: auto;
      max-height: none;
      aspect-ratio: auto;
    }
    .media-card.is-full-feature {
      grid-column: span 12;
      grid-row: span 7;
      height: auto;
      max-height: none;
      aspect-ratio: auto;
    }
    .media-card.is-side-feature {
      grid-column: span 6;
      grid-row: span 5;
      height: auto;
      aspect-ratio: auto;
    }
    .media-card.is-motion {
      grid-column: span 6;
      grid-row: span 4;
      height: auto;
      aspect-ratio: auto;
    }
    .media-card.is-tall-tile {
      grid-column: span 3;
      grid-row: span 4;
      height: auto;
      aspect-ratio: auto;
    }
    .media-card.is-live-tile {
      grid-column: span 3;
      grid-row: span 4;
      height: auto;
      aspect-ratio: auto;
    }
    .media-card.is-poster-tile {
      grid-column: span 3;
      grid-row: span 4;
      height: auto;
      aspect-ratio: auto;
    }
    .media-card.is-cover {
      grid-column: span 8;
      grid-row: span 4;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 620px;
    }
    .media-card.is-feature-video {
      grid-column: 2 / span 9;
      grid-row: span 5;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 720px;
    }
    .media-card.is-feature-wide {
      grid-column: 2 / span 10;
      grid-row: span 5;
      height: auto;
      aspect-ratio: 1.91 / 1;
      max-height: 760px;
    }
    .media-card.is-thumb-strip {
      grid-column: span 12;
      grid-row: span 5;
      height: clamp(420px, 32vw, 620px);
      background: #0a0d14;
      color: #f3f3f3;
      isolation: isolate;
    }
    .media-card.is-wide {
      grid-column: span 6;
      grid-row: span 4;
      height: auto;
      aspect-ratio: 16 / 9;
    }
    .media-card.is-portrait { grid-column: span 4; grid-row: span 4; height: auto; }
    .media-card.is-square { grid-column: span 4; grid-row: span 3; height: auto; aspect-ratio: auto; }
    .media-card.is-page {
      grid-column: span 8;
      grid-row: span 4;
      height: auto;
      aspect-ratio: 4 / 3;
      max-height: 680px;
      overflow: hidden;
    }
    .media-card.is-solo {
      grid-column: 2 / span 8;
    }
    .media-grid:has(.media-card:only-child) .media-card {
      grid-column: 2 / span 8;
    }
    .media-scroll {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #f7f7f7;
    }
    .media-card.is-cover .media-scroll,
    .media-card.is-feature-video .media-scroll,
    .media-card.is-feature-wide .media-scroll,
    .media-card.is-wide .media-scroll,
    .media-card.is-page .media-scroll,
    .media-card.is-portrait .media-scroll,
    .media-card.is-page-feature .media-scroll,
    .media-card.is-full-feature .media-scroll,
    .media-card.is-side-feature .media-scroll,
    .media-card.is-motion .media-scroll,
    .media-card.is-tall-tile .media-scroll,
    .media-card.is-live-tile .media-scroll,
    .media-card.is-poster-tile .media-scroll {
      height: 100%;
      display: block;
      overflow: hidden;
    }
    .media-scroll img,
    .media-scroll video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      pointer-events: none;
      background: #f7f7f7;
    }
    .media-card.is-cover img,
    .media-card.is-feature-video img,
    .media-card.is-feature-wide img,
    .media-card.is-wide img,
    .media-card.is-page img,
    .media-card.is-portrait img,
    .media-card.is-page-feature img,
    .media-card.is-full-feature img,
    .media-card.is-motion img {
      width: 100%;
      height: auto;
      min-height: 100%;
      object-fit: initial;
    }
    .media-card.is-side-feature img,
    .media-card.is-tall-tile img,
    .media-card.is-live-tile img,
    .media-card.is-poster-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .media-card.is-pan-ready .media-scroll img {
      height: auto;
      min-height: 100%;
      will-change: transform;
      transition: transform .35s ease;
    }
    .media-card.is-pan-ready::after {
      content: "Slow preview";
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 3;
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--jm-grey);
      background: rgba(255,255,255,.76);
      font-size: .66rem;
      font-weight: 800;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .media-card.is-pan-ready:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
    .media-scroll video { background: #141414; object-fit: contain; pointer-events: auto; }
    .media-caption {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--jm-grey);
      background: rgba(255,255,255,.72);
      border-radius: 5px;
      padding: 7px 9px;
      font-size: .68rem;
      font-weight: 700;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .media-card:hover .media-caption { opacity: 1; transform: translateY(0); }
    .thumb-strip-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 8%, rgba(255,255,255,.34), transparent 34%),
        radial-gradient(circle at 62% 20%, rgba(46,84,254,.16), transparent 38%),
        linear-gradient(120deg, #242932 0%, #0a0d14 44%, #070910 100%);
    }
    .thumb-strip-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: .18;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.42) 1px, transparent 0),
        radial-gradient(circle at 3px 5px, rgba(0,0,0,.8) 1px, transparent 0);
      background-size: 5px 5px, 7px 7px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .thumb-strip-label {
      position: absolute;
      left: clamp(18px, 4vw, 68px);
      top: clamp(18px, 2vw, 36px);
      z-index: 4;
      display: grid;
      gap: 5px;
      color: rgba(245,245,245,.72);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: 0;
    }
    .thumb-strip-label span + span {
      color: rgba(245,245,245,.46);
      font-size: .66rem;
    }
    .thumb-strip-track {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .thumb-strip-item {
      --tile-w: clamp(190px, 15vw, 300px);
      position: absolute;
      width: var(--tile-w);
      aspect-ratio: 1 / 1;
      margin: 0;
      overflow: hidden;
      background: #efefef;
      box-shadow: 0 22px 46px rgba(0,0,0,.28);
      opacity: .42;
      filter: saturate(.68) brightness(.76);
    }
    .thumb-strip-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      box-sizing: border-box;
      pointer-events: none;
    }
    .thumb-strip-item.is-focus {
      --tile-w: clamp(340px, 28vw, 540px);
      left: 50%;
      top: 50%;
      z-index: 6;
      opacity: 1;
      filter: none;
      background: #f6f6f6;
      transform: translate(-50%, -54%);
      box-shadow: 0 30px 70px rgba(0,0,0,.34);
    }
    .thumb-strip-item.is-focus img {
      object-fit: contain;
      padding: clamp(10px, 1.1vw, 20px);
    }
    .thumb-pos-1 { left: 7%; top: 18%; }
    .thumb-pos-2 { left: 23%; top: 18%; opacity: .5; }
    .thumb-pos-3 { left: 39%; top: 18%; opacity: .38; }
    .thumb-pos-4 { right: 22%; top: 18%; opacity: .36; }
    .thumb-pos-5 { right: 6%; top: 18%; opacity: .42; }
    .thumb-pos-6 { left: 8%; top: 56%; opacity: .5; }
    .thumb-pos-7 { left: 26%; top: 56%; opacity: .44; }
    .thumb-pos-8 { right: 27%; top: 56%; opacity: .34; }
    .thumb-pos-9 { right: 10%; top: 56%; opacity: .32; }
    .thumb-pos-10 { left: -8%; top: 18%; opacity: .28; }
    .thumb-pos-11 { right: -8%; top: 18%; opacity: .28; }
    .thumb-pos-12 { left: -6%; top: 56%; opacity: .25; }
    .thumb-pos-13 { right: -7%; top: 56%; opacity: .25; }
    .thumb-pos-14 { left: 43%; top: 62%; opacity: .22; }
    .media-card.is-thumb-strip .media-caption {
      color: rgba(255,255,255,.76);
      background: rgba(12,14,20,.42);
      border: 1px solid rgba(255,255,255,.08);
    }
    #zonli .media-grid {
      grid-auto-rows: clamp(96px, 5.2vw, 124px);
      gap: 8px;
      padding: 0 clamp(38px, 4.8vw, 88px) clamp(44px, 4vw, 78px);
    }
    #zonli .media-card {
      border-radius: 3px;
      background: #f5f5f5;
    }
    #zonli .media-card.is-feature-wide {
      grid-column: 2 / span 10;
      grid-row: span 5;
    }
    #zonli .media-card.is-wide,
    #zonli .media-card.is-motion {
      grid-column: span 6;
      grid-row: span 3;
      aspect-ratio: 1.91 / 1;
    }
    #zonli .media-card.is-tall-tile {
      grid-column: span 3;
      grid-row: span 5;
      height: auto;
    }
    #zonli .media-card.is-square {
      grid-column: span 3;
      grid-row: span 3;
      height: auto;
    }
    #zonli .media-card.is-square img,
    #zonli .media-card.is-tall-tile img,
    #zonli .media-card.is-wide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .case-study {
      --case-side: clamp(38px, 4.8vw, 88px);
      display: grid;
      gap: 0;
      padding-bottom: clamp(46px, 5vw, 92px);
      color: var(--jm-ink);
      background: var(--jm-card);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function stripRich(text) {
      return String(text || '').replace(/\*\*(.*?)\*\*/g, '$1');
    }

    function splitTags(tags) {
      return String(tags || '').split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function visibleSeriesItems(series) {
      return (series?.items || []).filter(item => !item.hidden);
    }

    function projectAssets(project) {
      if (Array.isArray(project?.groups)) {
        return project.groups.flatMap(group =>
          (group.series || []).flatMap(series => visibleSeriesItems(series))
        );
      }
      return (project?.assets || []).filter(asset => asset.displayMode !== 'hidden');
    }

    function projectAssetCount(project) {
      return projectAssets(project).length;
    }

    function groupAssetCount(group) {
      return (group?.series || []).reduce((count, series) => count + visibleSeriesItems(series).length, 0);
    }

    // Immutable CDN route; rawUrl remains the canonical GitHub source in the seed.
    function workCdnUrl(url) {
      if (window.SITE_MEDIA_MAP[url]) return window.SITE_MEDIA_MAP[url];
      return String(url || '')
        .replace(/^https:\/\/raw\.githubusercontent\.com\/zhoutingyang80-max\/26-\/([a-f0-9]{40})\/(.+)$/, 'https://cdn.jsdelivr.net/gh/zhoutingyang80-max/26-@$1/$2')
        .replace('https://raw.githubusercontent.com/zhoutingyang80-max/26-/refs/heads/main/', 'https://cdn.jsdelivr.net/gh/zhoutingyang80-max/26-@86935eb/');
    }
    function workRawUrl(url) {
      return String(url || '')
        .replace(/^https:\/\/cdn\.jsdelivr\.net\/gh\/zhoutingyang80-max\/26-@([a-f0-9]{40})\/(.+)$/, 'https://raw.githubusercontent.com/zhoutingyang80-max/26-/$1/$2')
        .replace('https://cdn.jsdelivr.net/gh/zhoutingyang80-max/26-@86935eb/', 'https://raw.githubusercontent.com/zhoutingyang80-max/26-/refs/heads/main/');
    }
    function mediaSrc(asset) {
      if (!asset) return '';
      if (assetBase && asset.rawUrl) {
        const marker = '/refs/heads/main/';
        const markerIndex = asset.rawUrl.indexOf(marker);
        const relativeUrl = markerIndex >= 0 ? asset.rawUrl.slice(markerIndex + marker.length) : (asset.rawUrl.match(/^https:\/\/raw\.githubusercontent\.com\/zhoutingyang80-max\/26-\/[a-f0-9]{40}\/(.+)$/)?.[1] || '');
        if (relativeUrl) return assetBase.replace(/\/$/, '') + '/' + relativeUrl;
      }
      return workCdnUrl(asset.rawUrl || '');
    }

    function applyTheme() {
      const root = document.documentElement;
      const theme = { ...defaultTheme, ...(state.theme || {}) };
      root.style.setProperty('--jm-bg', theme.bg);
      root.style.setProperty('--jm-warm', theme.warm);
      root.style.setProperty('--jm-orange', theme.orange);
      root.style.setProperty('--jm-orange-2', theme.orange2);
      root.style.setProperty('--jm-blue', theme.blue);
      root.style.setProperty('--jm-grey', theme.grey);
      root.style.setProperty('--jm-ink', theme.ink);
      root.style.setProperty('--jm-card', theme.card);
    }

    function projectThumb(project) {
      const assets = projectAssets(project);
      return assets.find(asset => asset.kind !== 'video') || assets[0];
    }

    function renderNav() {
      const descriptions = { zonli: '网页 · 广告 · AI视觉', nouhaus: '家居 · 品牌视觉', luckin: '瑞幸 · 直播间场景' };
      projectNav.innerHTML = state.projects.map((project, index) => `<li class="work-nav-item">
        <a class="work-nav-link" href="#${escapeHtml(project.id)}">
          <span class="work-nav-index" aria-hidden="true">${String(index + 1).padStart(2, '0')}</span>
          <span class="work-nav-text"><strong>${escapeHtml(project.id === 'nouhaus' ? 'Nouhaus' : project.title || project.id)}</strong><small>${escapeHtml(descriptions[project.id] || '项目作品')}</small></span>
          <span class="work-nav-arrow" aria-hidden="true">↗</span>
        </a>
      </li>`).join('');
    }

    // Three project bounds only; one frame at most per scroll update.
    let projectNavFrame = 0;
    function syncProjectNavigation() {
      projectNavFrame = 0;
      const marker = window.matchMedia('(max-width: 991px)').matches
        ? document.querySelector('.work-nav-rail').getBoundingClientRect().bottom + 12 : 112;
      const sections = [...projectMount.querySelectorAll(':scope > .project-block')];
      const current = sections.filter(section => section.getBoundingClientRect().top <= marker).pop();
      projectNav.querySelectorAll('.work-nav-link').forEach(link => {
        const active = Boolean(current && link.getAttribute('href') === `#${current.id}`);
        link.classList.toggle('is-current', active);
        if (active) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    }
    function queueProjectNavigation() {
      if (!projectNavFrame) projectNavFrame = requestAnimationFrame(syncProjectNavigation);
    }
    window.addEventListener('scroll', queueProjectNavigation, { passive: true });
    window.addEventListener('resize', queueProjectNavigation, { passive: true });
    window.addEventListener('hashchange', queueProjectNavigation);

    function mediaCard(asset, index, extraClass = '') {
      if (asset.kind === 'thumbStrip' || asset.layout === 'thumbStrip') {
        return thumbnailStripCard(asset);
      }
      const src = mediaSrc(asset);
      const layoutClass = {
        cover: 'is-cover',
        featureVideo: 'is-feature-video',
        featureWide: 'is-feature-wide',
        thumbStrip: 'is-thumb-strip',
        wide: 'is-wide',
        page: 'is-page',
        pageFeature: 'is-page-feature',
        fullFeature: 'is-full-feature',
        sideFeature: 'is-side-feature',
        motion: 'is-motion',
        tallTile: 'is-tall-tile',
        liveTile: 'is-live-tile',
        posterTile: 'is-poster-tile',
        portrait: 'is-portrait',
        square: 'is-square',
      }[asset.layout] || '';
      const isDeferredCollection = /(?:case-campaign-card|archive-card)/.test(extraClass);
      const isCampaignCard = /case-campaign-card/.test(extraClass);
      const priorityImage = !isDeferredCollection && index === 0;
      const media = asset.kind === 'video'
        ? (isCampaignCard
          ? `<video data-src="${escapeHtml(src)}" data-work-autoplay="true" muted loop playsinline preload="none" aria-label="${escapeHtml(asset.categoryTitle || asset.useRole || 'campaign motion')}"></video>`
          : `<video data-src="${escapeHtml(src)}" controls muted playsinline preload="none"></video>`)
        : `<img src="${escapeHtml(src)}" alt="${escapeHtml(asset.categoryTitle || asset.useRole || 'work asset')}" loading="${priorityImage ? 'eager' : 'lazy'}" decoding="async"${priorityImage ? ' fetchpriority="high"' : ''}>`;
      return `<article class="media-card ${layoutClass} ${escapeHtml(extraClass)}" data-asset-id="${escapeHtml(asset.id || '')}">
        <div class="media-scroll">${media}</div>
        <div class="media-caption"><span>${escapeHtml(asset.categoryTitle || asset.useRole || '')}</span><span>${escapeHtml(asset.outputMB || asset.originalMB || '')} MB</span></div>
      </article>`;
    }

    function thumbnailStripCard(asset) {
      const items = Array.isArray(asset.items) && asset.items.length ? asset.items : [asset];
      const focusIndex = Math.min(Math.max(Number(asset.focusIndex || 0), 0), items.length - 1);
      const ordered = [items[focusIndex], ...items.filter((_, itemIndex) => itemIndex !== focusIndex)];
      const stripTitle = asset.stripTitle || asset.categoryTitle || 'Visual system';
      const stripSubtitle = asset.stripSubtitle || `${items.length} visuals grouped`;
      const thumbs = ordered.slice(0, 15).map((item, itemIndex) => {
        const src = mediaSrc(item);
        const title = item.categoryTitle || item.useRole || item.outputName || 'thumbnail';
        const focusClass = itemIndex === 0 ? ' is-focus' : '';
        return `<figure class="thumb-strip-item thumb-pos-${itemIndex}${focusClass}">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" loading="lazy" decoding="async">
        </figure>`;
      }).join('');
      return `<article class="media-card is-thumb-strip">
        <div class="thumb-strip-stage">
          <div class="thumb-strip-label"><span>${escapeHtml(stripTitle)}</span><span>${escapeHtml(stripSubtitle)}</span></div>
          <div class="thumb-strip-track">${thumbs}</div>
        </div>
        <div class="media-caption"><span>${escapeHtml(asset.categoryTitle || asset.useRole || 'thumbnail array')}</span><span>${escapeHtml(items.length)} items</span></div>
      </article>`;
    }

    function caseSectionHead(section) {
      return `<div class="case-section-head">
        <span class="case-section-index">${escapeHtml(section.index || '')}</span>
        <div>
          <p class="case-section-label">${escapeHtml(section.label || '')}</p>
          <h3 class="case-section-title">${escapeHtml(section.title || '')}</h3>
        </div>
        <p class="case-section-copy">${escapeHtml(section.body || '')}</p>
      </div>`;
    }

    function renderOverviewSection(project, section) {
      return `<section class="case-section" id="${escapeHtml(project.id)}-${escapeHtml(section.id)}">
        ${caseSectionHead(section)}
        <div class="overview-brief">
          <p>${escapeHtml(project.roleSummary || project.caseSummary || '')}</p>
          <small>${escapeHtml(project.developmentCredit || '')}</small>
        </div>
      </section>`;
    }

    function renderPageSuiteSection(project, section) {
      const pages = (project.assets || []).filter(asset => asset.caseSection === section.id && asset.displayMode === 'case');
      const secondaryCount = Math.max(0, pages.length - 1);
      return `<section class="case-section" id="${escapeHtml(project.id)}-${escapeHtml(section.id)}">
        ${caseSectionHead(section)}
        <div class="case-page-grid is-secondary-${secondaryCount}">
          ${pages.map((asset, index) => {
            const proofClass = index === 0 ? 'is-home' : 'is-secondary';
            const proofLabel = index === 0 ? '主页主视觉' : (asset.proofLabel || '页面缩略图');
            return `<article class="page-proof ${proofClass}">
              <div class="page-proof-caption"><span>${escapeHtml(asset.categoryTitle || asset.outputName || '')}</span><span>${escapeHtml(proofLabel)}</span></div>
              ${mediaCard(asset, index, 'case-page-card')}
            </article>`;
          }).join('')}
        </div>
      </section>`;
    }

    function renderProjectShowcaseSection(project, section) {
      const featured = (project.assets || []).filter(asset => asset.caseSection === section.id && asset.displayMode === 'case');
      const lead = featured.filter(asset => asset.showcaseFormat === 'lead');
      const tiles = featured.filter(asset => asset.showcaseFormat !== 'lead');
      const gridClass = section.gridClass || 'is-square-grid';
      return `<section class="case-section" id="${escapeHtml(project.id)}-${escapeHtml(section.id)}">
        ${caseSectionHead(section)}
        <div class="project-showcase-wall">
          ${lead.length ? `<div class="project-showcase-lead">${lead.map((asset, index) => mediaCard(asset, index, 'project-showcase-card is-showcase-lead')).join('')}</div>` : ''}
          ${tiles.length ? `<div class="project-showcase-tiles is-grid-4 ${escapeHtml(gridClass)}">${tiles.map((asset, index) => mediaCard(asset, index, 'project-showcase-card is-showcase-tile')).join('')}</div>` : ''}
        </div>
      </section>`;
    }

    const CAMPAIGN_FORMAT_OPTIONS = {
      auto: '自动识别',
      landscape: '横版 1.91:1',
      square: '方图 1:1',
      portrait: '竖版 9:16',
      motion: '独立动效（归档）'
    };

    function campaignFormatFor(asset) {
      const requested = asset?.campaignFormat;
      if (requested && requested !== 'auto' && CAMPAIGN_FORMAT_OPTIONS[requested]) return requested;
      if (asset?.kind === 'video') return 'motion';
      if (['tallTile', 'portrait'].includes(asset?.layout)) return 'portrait';
      if (asset?.layout === 'square') return 'square';
      return 'landscape';
    }

    function renderCampaignSection(project, section) {
      const featured = (project.assets || []).filter(asset => asset.caseSection === section.id && asset.displayMode === 'case');
      const formatOrder = ['landscape', 'square', 'portrait'];
      return `<section class="case-section" id="${escapeHtml(project.id)}-${escapeHtml(section.id)}">
        ${caseSectionHead(section)}
        <div class="campaign-wall">${formatOrder.map(format => {
          const items = featured.filter(asset => campaignFormatFor(asset) === format);
          if (!items.length) return '';
          return `<div class="campaign-format-band is-band-${format}" data-campaign-band="${format}">${items.map((asset, index) =>
            mediaCard(asset, index, `case-campaign-card is-campaign-${format}`)
          ).join('')}</div>`;
        }).join('')}</div>
      </section>`;
    }

    function renderOutcomeSection(project, section) {
      return `<section class="case-section" id="${escapeHtml(project.id)}-${escapeHtml(section.id)}">
        ${caseSectionHead(section)}
        <div class="outcome-panel">
          <div>
            <span class="case-outcome-label">${escapeHtml(project.outcomeLabel || 'Outcome')}</span>
            <div class="case-outcome-value">${escapeHtml(project.outcomeValue || 'Pending')}</div>
          </div>
          <p class="case-outcome-note">${escapeHtml(project.outcomeNote || '')}</p>
        </div>
      </section>`;
    }

    function caseArchiveGroupsMarkup(project) {
      const ads = (project.assets || []).filter(asset => asset.caseSection === 'campaign-system' && asset.displayMode !== 'hidden');
      const groups = [
        { label: '横版 / LANDSCAPE', className: 'is-landscape', match: asset => campaignFormatFor(asset) === 'landscape' },
        { label: '方图 / SQUARE', className: 'is-square', match: asset => campaignFormatFor(asset) === 'square' },
        { label: '竖版 / PORTRAIT', className: 'is-portrait', match: asset => campaignFormatFor(asset) === 'portrait' },
        { label: '动效 / MOTION', className: 'is-motion', match: asset => campaignFormatFor(asset) === 'motion' }
      ];
      return groups.map(group => {
        const items = ads.filter(group.match);
        if (!items.length) return '';
        return `<section class="archive-group">
          <h4 class="archive-group-title"><span>${escapeHtml(group.label)}</span><span>${items.length}</span></h4>
          <div class="archive-grid ${group.className}">${items.map((asset, index) => mediaCard(asset, index, 'archive-card')).join('')}</div>
        </section>`;
      }).join('');
    }

    function renderCaseArchive(project) {
      if (!project.archiveConfig?.enabled) return '';
      const ads = (project.assets || []).filter(asset => asset.caseSection === 'campaign-system' && asset.displayMode !== 'hidden');
      return `<details class="case-archive" ${project.archiveConfig.defaultOpen ? 'open' : ''}>
        <summary><span>${escapeHtml(project.archiveConfig.title || '完整广告素材归档')}</span><span>${ads.length} 项 / 展开归档</span></summary>
        <p class="archive-intro">${escapeHtml(project.archiveConfig.description || '')}</p>
        <div class="archive-mount" data-archive-project="${escapeHtml(project.id)}"></div>
      </details>`;
    }

    function setupCaseArchives(root = document) {
      root.querySelectorAll('.case-archive').forEach(details => {
        const mount = details.querySelector('[data-archive-project]');
        if (!mount) return;
        const hydrate = () => {
          if (!details.open || mount.dataset.hydrated === '1') return;
          const project = state.projects.find(item => item.id === mount.dataset.archiveProject);
          if (!project) return;
          mount.innerHTML = caseArchiveGroupsMarkup(project);
          mount.dataset.hydrated = '1';
          requestAnimationFrame(() => setupHoverPreview(mount));
        };
        details.addEventListener('toggle', hydrate);
        hydrate();
      });
    }

    function renderCaseStudy(project) {
      const sections = Array.isArray(project.caseSections) ? project.caseSections : [];
      const sectionRenderers = {
        overview: renderOverviewSection,
        'page-suite': renderPageSuiteSection,
        'project-showcase': renderProjectShowcaseSection,
        'campaign-wall': renderCampaignSection,
        'campaign-groups': renderCampaignSection,
        outcome: renderOutcomeSection
      };
      return `<div class="case-study">
        <section class="case-hero">
          <div>
            <p class="case-kicker">${escapeHtml(project.caseKicker || '')}</p>
            <h3 class="case-headline">${escapeHtml(project.caseHeadline || project.title || '')}</h3>
            <p class="case-summary">${escapeHtml(project.caseSummary || '')}</p>
          </div>
          <div class="case-outcome">
            <span class="case-outcome-label">${escapeHtml(project.outcomeLabel || 'Outcome')}</span>
            <strong class="case-outcome-value">${escapeHtml(project.outcomeValue || 'Pending')}</strong>
            <p class="case-outcome-note">${escapeHtml(project.developmentCredit || '')}</p>
          </div>
        </section>
        <nav class="case-chapter-nav" aria-label="${escapeHtml(project.title || 'Project')} chapters">
          ${sections.map(section => `<a href="#${escapeHtml(project.id)}-${escapeHtml(section.id)}"><span>${escapeHtml(section.index || '')}</span><div><strong>${escapeHtml(section.navTitle || section.title || section.id)}</strong><small>${escapeHtml(section.label || '')}</small></div></a>`).join('')}
        </nav>
        ${sections.map(section => {
          const renderer = sectionRenderers[section.type];
          return renderer ? renderer(project, section) : '';
        }).join('')}
        ${renderCaseArchive(project)}
      </div>`;
    }

    function archiveAssetTitle(item) {
      const raw = String(item?.title || item?.fileName || 'Work asset')
        .replace(/\.(?:jpe?g|png|webp|gif|mp4|mov)$/i, '')
        .replaceAll('_', ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const known = [
        [/^www\.zonlihome\.com$/i, 'Zonli 官网首页'],
        [/collections bundle/i, 'Bundle 类目页'],
        [/collections bts-sale/i, 'BTS Sale 活动页'],
        [/collections zonli-floor-living-challenge/i, 'Floor Living Challenge 活动页'],
        [/products compact-living-bundle/i, 'Compact Living 产品页'],
        [/products cooling-comfort-bundle/i, 'Cooling Comfort 产品页'],
        [/products cozy-family-floor-bundle/i, 'Cozy Family Floor 产品页']
      ];
      const matched = known.find(([pattern]) => pattern.test(raw));
      return matched ? matched[1] : raw;
    }

    function archiveOrientation(item, groupId) {
      if (item?.orientation && item.orientation !== 'motion') return item.orientation;
      if (['collab-live', 'green-screen', 'physical-live'].includes(groupId)) return 'portrait';
      if (item?.layout === 4 || item?.layout === 6) return 'square';
      return 'landscape';
    }

    function archiveMediaCard(item, index, groupId) {
      const src = mediaSrc(item);
      const title = archiveAssetTitle(item);
      const orientation = archiveOrientation(item, groupId);
      const crop = item.liveCrop;
      const originalWidth = Number(crop?.width || item.width) || 0;
      const width = crop ? originalWidth - crop.left - crop.right : originalWidth;
      const height = Number(crop?.height || item.height) || 0;
      const cropAttributes = crop ? `data-live-crop-left="${crop.left}" data-live-crop-right="${crop.right}"` : '';
      const cropStyle = crop ? `;--live-crop-focus:${crop.left / (crop.left + crop.right) * 100}%` : '';
      const cropClass = crop ? ' has-live-crop' : '';
      const fallbackRatioValue = orientation === 'portrait' ? 4 / 5 : orientation === 'square' ? 1 : 16 / 9;
      const mediaRatioValue = width > 0 && height > 0 ? width / height : fallbackRatioValue;
      const mediaRatio = width > 0 && height > 0 ? `${width} / ${height}` : String(fallbackRatioValue);
      const autoplayVideo = item.kind === 'video' && item.autoplay === true;
      const media = item.kind === 'video'
        ? `<div class="archive-media-button${cropClass}" data-orientation="${escapeHtml(orientation)}" style="aspect-ratio:${escapeHtml(mediaRatio)}${cropStyle}" ${cropAttributes}><video data-src="${escapeHtml(src)}" ${autoplayVideo ? 'data-work-autoplay="true"' : 'controls'} muted loop playsinline preload="none" aria-label="${escapeHtml(title)}"></video></div>`
        : `<button class="archive-media-button${cropClass}" type="button" data-orientation="${escapeHtml(orientation)}" style="aspect-ratio:${escapeHtml(mediaRatio)}${cropStyle}" ${cropAttributes} data-lightbox-src="${escapeHtml(src)}" data-lightbox-title="${escapeHtml(title)}"><img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" loading="lazy" decoding="async"></button>`;
      return `<figure class="archive-media-card" data-item-id="${escapeHtml(item.id || '')}" data-media-ratio="${mediaRatioValue.toFixed(6)}">
        ${media}
        <figcaption class="archive-media-caption"><span>${escapeHtml(title)}</span><span>${String(index + 1).padStart(2, '0')}</span></figcaption>
      </figure>`;
    }

    function seriesGridClass(layout) {
      const value = Number(layout);
      if ([1, 2, 4, 6].includes(value)) return `cols-${value}`;
      return 'cols-4';
    }

    function pagePreviewMode(item) {
      if (item?.previewMode === 'mobile') return 'mobile';
      const source = [item?.title, item?.fileName, item?.sourcePath, item?.seriesTitle]
        .filter(Boolean)
        .join(' ');
      return /手机端|mobile/i.test(source) ? 'mobile' : 'desktop';
    }

    function renderPageBrowser(items, browserId) {
      if (!items.length) return '';
      const first = items[0];
      const firstSrc = mediaSrc(first);
      const firstTitle = archiveAssetTitle(first);
      const firstMode = pagePreviewMode(first);
      return `<div class="page-browser" data-page-browser="${escapeHtml(browserId)}">
        <div class="page-browser-list" role="tablist" aria-label="长页列表">
          ${items.map((item, index) => {
            const title = archiveAssetTitle(item);
            return `<button class="page-browser-tab ${index === 0 ? 'is-active' : ''}" type="button" role="tab" aria-selected="${index === 0 ? 'true' : 'false'}" data-page-src="${escapeHtml(mediaSrc(item))}" data-page-title="${escapeHtml(title)}" data-page-mode="${pagePreviewMode(item)}">
              <span>${String(index + 1).padStart(2, '0')}</span><strong>${escapeHtml(title)}</strong>
            </button>`;
          }).join('')}
        </div>
        <div class="page-browser-stage ${firstMode === 'mobile' ? 'is-mobile-preview' : ''}">
          <div class="page-browser-toolbar"><span data-page-browser-title>${escapeHtml(firstTitle)}</span><span>滚轮 / TOUCH SCROLL</span></div>
          <div class="page-browser-device"><div class="page-browser-scroll" tabindex="0"><img src="${escapeHtml(firstSrc)}" alt="${escapeHtml(firstTitle)}" loading="lazy" decoding="async"></div></div>
        </div>
      </div>`;
    }

    function renderArchiveSeries(series, groupId, seriesIndex) {
      const items = visibleSeriesItems(series);
      if (!items.length || series.layout === 'pagecase') return '';
      const isUnifiedGallery = ['advertising', 'ai-visual', 'product-visual', 'extension-materials', 'collab-live', 'green-screen', 'physical-live'].includes(groupId);
      const density = [1, 2, 4, 6].includes(Number(series.layout)) ? Number(series.layout) : 4;
      const useEagleGrid = !String(series.id || '').startsWith('luckin-curated-') && density !== 1 && items.length > 1;
      return `<section class="archive-series" data-series-id="${escapeHtml(series.id || '')}">
        ${isUnifiedGallery ? '' : `<header class="archive-series-head">
          <h4 class="archive-series-title">${escapeHtml(series.title || `Series ${seriesIndex + 1}`)}</h4>
          <span class="archive-series-meta">${items.length} 项 / ${escapeHtml(String(series.layout || 4))} GRID</span>
        </header>`}
        <div class="archive-grid ${seriesGridClass(series.layout)} ${useEagleGrid ? 'is-eagle-grid' : ''} ${isUnifiedGallery ? 'is-unified-gallery' : ''}" data-grid-density="${density}">${items.map((item, index) => archiveMediaCard(item, index, groupId)).join('')}</div>
      </section>`;
    }

    function renderArchiveGroup(project, group) {
      const series = group.series || [];
      const pageItems = series
        .filter(item => item.layout === 'pagecase')
        .flatMap(seriesItem => visibleSeriesItems(seriesItem).map(item => ({ ...item, seriesTitle: seriesItem.title })));
      const count = groupAssetCount(group);
      const isUnifiedAdvertising = project.id === 'zonli' && group.id === 'advertising';
      const isUnifiedAiVisual = project.id === 'zonli' && group.id === 'ai-visual';

    const eagleGridQueue = new Set();
    const eagleGridWidths = new WeakMap();
    let eagleGridFrame = 0;
    let eagleGridObserver = null;

    function eagleMediaRatio(card) {
      const ratio = Number(card.dataset.mediaRatio);
      return Number.isFinite(ratio) && ratio > 0 ? ratio : 1;
    }

    function eagleDensity(grid, width) {
      const density = Number(grid.dataset.gridDensity) || 4;
      if (width <= 640) return density <= 2 ? 1 : 2;
      if (width <= 980 && density === 6) return 4;
      return density;
    }

    function layoutEagleGrid(grid) {
      const cards = [...grid.querySelectorAll('.archive-media-card')];
      const availableWidth = grid.clientWidth;
      if (!cards.length || availableWidth <= 0) return;

      const gap = Number.parseFloat(getComputedStyle(grid).getPropertyValue('--eagle-gap')) || 7;
      const density = Math.max(1, eagleDensity(grid, availableWidth));
      const ratios = cards.map(eagleMediaRatio);
      const sortedRatios = [...ratios].sort((a, b) => a - b);
      const representativeRatio = sortedRatios[Math.floor(sortedRatios.length / 2)] || 1;
      const targetHeight = Math.max(72, (availableWidth - gap * (density - 1)) / (density * representativeRatio));
      const rows = [];
      let rowCards = [];
      let ratioSum = 0;

      cards.forEach((card, index) => {
        const ratio = ratios[index];
        rowCards.push({ card, ratio });
        ratioSum += ratio;
        if (rowCards.length >= density) {
          rows.push({ items: rowCards, ratioSum, complete: true });
          rowCards = [];
          ratioSum = 0;
        }
      });
      if (rowCards.length) rows.push({ items: rowCards, ratioSum, complete: false });

      const fragment = document.createDocumentFragment();
      rows.forEach(row => {
        const rowElement = document.createElement('div');
        rowElement.className = 'eagle-row';
        const usableWidth = availableWidth - gap * (row.items.length - 1);
        const fillHeight = usableWidth / row.ratioSum;
        const rowHeight = row.complete ? fillHeight : Math.min(targetHeight, fillHeight);
        let assignedWidth = 0;

        row.items.forEach(({ card, ratio }, index) => {
          let cardWidth = rowHeight * ratio;
          if (row.complete && index === row.items.length - 1) cardWidth = usableWidth - assignedWidth;
          assignedWidth += cardWidth;
          card.style.setProperty('--eagle-card-width', `${Math.max(1, cardWidth).toFixed(3)}px`);
          rowElement.appendChild(card);
        });
        fragment.appendChild(rowElement);
      });
      grid.replaceChildren(fragment);
    }

    function scheduleEagleGridLayout(grid) {
      if (!grid?.classList.contains('is-eagle-grid')) return;
      eagleGridQueue.add(grid);
      if (eagleGridFrame) return;
      eagleGridFrame = requestAnimationFrame(() => {
        eagleGridFrame = 0;
        const grids = [...eagleGridQueue];
        eagleGridQueue.clear();
        grids.forEach(layoutEagleGrid);
      });
    }

    function setupEagleArchiveGrids(root = document) {
      eagleGridObserver?.disconnect();
      const grids = [...root.querySelectorAll('.archive-grid.is-eagle-grid')];
      eagleGridObserver = new ResizeObserver(entries => {
        entries.forEach(entry => {
          const width = Math.round(entry.contentRect.width);
          if (Math.abs((eagleGridWidths.get(entry.target) || 0) - width) <= 1) return;
          eagleGridWidths.set(entry.target, width);
          scheduleEagleGridLayout(entry.target);
        });
      });
      grids.forEach(grid => {
        eagleGridObserver.observe(grid);
        scheduleEagleGridLayout(grid);
      });
    }

    function setupArchiveMediaRatios(root = document) {
      root.querySelectorAll('.archive-media-button').forEach(frame => {
        const media = frame.querySelector('img, video');
        if (!media) return;

        const syncRatio = () => {
          const isVideo = media instanceof HTMLVideoElement;
          const width = isVideo ? media.videoWidth : media.naturalWidth;
          const height = isVideo ? media.videoHeight : media.naturalHeight;
          if (!width || !height) return;
          const cropLeft = Number(frame.dataset.liveCropLeft) || 0;
          const cropRight = Number(frame.dataset.liveCropRight) || 0;
          const displayWidth = Math.max(1, width - cropLeft - cropRight);
          frame.style.aspectRatio = `${displayWidth} / ${height}`;
          if (cropLeft || cropRight) {
            frame.style.setProperty('--live-crop-focus', `${cropLeft / (cropLeft + cropRight) * 100}%`);
          }
          frame.dataset.ratioSynced = '1';
          const card = frame.closest('.archive-media-card');
          if (card) card.dataset.mediaRatio = String(displayWidth / height);
          scheduleEagleGridLayout(frame.closest('.archive-grid.is-eagle-grid'));
        };

        if (media instanceof HTMLVideoElement) {
          if (media.readyState >= 1) syncRatio();
          else media.addEventListener('loadedmetadata', syncRatio, { once: true });
        } else if (media.complete && media.naturalWidth) {
          syncRatio();
        } else {
          media.addEventListener('load', syncRatio, { once: true });
        }
      });
    }

    function setupPageBrowsers(root = document) {
      root.querySelectorAll('[data-page-browser]').forEach(browser => {
        const tabs = [...browser.querySelectorAll('.page-browser-tab')];
        const scroll = browser.querySelector('.page-browser-scroll');
        const image = scroll?.querySelector('img');
        const title = browser.querySelector('[data-page-browser-title]');
        const stage = browser.querySelector('.page-browser-stage');
        if (!tabs.length || !scroll || !image || !title || !stage) return;

        tabs.forEach(tab => tab.addEventListener('click', () => {

          title.textContent = tab.dataset.pageTitle || '';
          stage.classList.toggle('is-mobile-preview', tab.dataset.pageMode === 'mobile');
          scroll.scrollTop = 0;
        }));

        scroll.addEventListener('wheel', event => {
          const atTop = scroll.scrollTop <= 0;
          const atBottom = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2;
          if ((event.deltaY < 0 && atTop) || (event.deltaY > 0 && atBottom)) return;
          event.preventDefault();
          scroll.scrollTop += event.deltaY;
        }, { passive: false });
      });
    }

    function setupArchiveLightbox(root = document) {

      if (root.dataset.lightboxBound === '1') return;

          frame.style.setProperty('--live-crop-focus', trigger.style.getPropertyValue('--live-crop-focus'));

    // Visitor lifecycle: entering Work in a new tab releases hidden-page video work.
    const workHiddenPlaying = new Set();
    function syncWorkVisibility() {
      document.querySelectorAll('video').forEach(video => {
        if (document.hidden) {
          if (!video.paused) workHiddenPlaying.add(video);
          video.pause();
        } else if (workHiddenPlaying.has(video) && video.isConnected) {
          const r = video.getBoundingClientRect();
          if (r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth) video.play().catch(() => {});
        }
      });
      if (!document.hidden) workHiddenPlaying.clear();
    }
    document.addEventListener('visibilitychange', syncWorkVisibility);
    document.addEventListener('play', event => {
      if (document.hidden && event.target instanceof HTMLVideoElement) event.target.pause();
    }, true);
    window.addEventListener('pagehide', () => document.querySelectorAll('video').forEach(video => video.pause()));
    window.addEventListener('pageshow', event => { if (event.persisted) syncWorkVisibility(); });
    let workMediaObserver = null;
    function setupWorkMedia(root = document) {
      workMediaObserver?.disconnect();
      workMediaObserver = new IntersectionObserver(entries => {
        for (const entry of entries) {
          const media = entry.target;
          if (entry.isIntersecting) {
            if (media.dataset.src && !media.getAttribute('src')) {
              media.src = media.dataset.src;
              media.preload = 'metadata';
              media.load();
            }
            if (!media.dataset.workTimer) {
              media.dataset.workTimer = '1';
              setTimeout(() => {
                if (!media.isConnected) return;
                const pending = media instanceof HTMLVideoElement ? media.readyState === 0 : (!media.complete || !media.naturalWidth);
                if (pending) retryWorkMedia(media);
              }, 15000);
            }
            if (!document.hidden && media.dataset.workAutoplay === 'true') media.play().catch(() => {});
          } else if (media instanceof HTMLVideoElement) media.pause();
        }
      }, { rootMargin: '200px 0px', threshold: .01 });
      root.querySelectorAll('#project-mount img, #project-mount video, #project-nav img').forEach(media => workMediaObserver.observe(media));
    }
    function retryWorkMedia(media) {
      const source = media.getAttribute('src') || media.dataset.src || '';
      if (source !== media.dataset.workRetrySource) {
        delete media.dataset.workFallbackTried;
        media.dataset.workRetrySource = source;
      }
      const raw = workRawUrl(source);
      if (raw && raw !== source && media.dataset.workFallbackTried !== '1') {
        media.dataset.workFallbackTried = '1';
        media.dataset.workRetrySource = raw;
        media.src = raw;
        if (media instanceof HTMLVideoElement) media.load();
        return;
      }
      const unit = media.closest('.page-proof, .media-card, .archive-media-card, .thumb-strip-item, .nav-preview') || media.parentElement;
      if (!unit || unit.querySelector('.work-media-retry')) return;
      const retry = document.createElement('button');
      retry.className = 'work-media-retry';
      retry.type = 'button';
      retry.textContent = '重新加载';
      retry.onclick = () => {
        retry.remove();
        delete media.dataset.workFallbackTried;
        media.src = workCdnUrl(raw);
        if (media instanceof HTMLVideoElement) media.load();
      };
      unit.appendChild(retry);
    }

    function setupHoverPreview(root = document) {
      root.querySelectorAll('.media-card').forEach(card => {
        const scroller = card.querySelector('.media-scroll');
        const image = scroller?.querySelector('img');
        if (!scroller || !image) return;

        const update = () => {
          image.style.transform = '';
          card.classList.remove('is-pan-ready');
          const overflow = image.getBoundingClientRect().height - scroller.getBoundingClientRect().height;
          if (overflow > 24) {
            card.classList.add('is-pan-ready');
            card.style.setProperty('--pan-distance', `${Math.ceil(overflow)}px`);
            card.style.setProperty('--pan-duration', `${Math.min(78, Math.max(22, overflow / 34)).toFixed(2)}s`);
          }
        };

        if (image.complete && image.naturalWidth) update();
        else image.addEventListener('load', update, { once: true });
      });
    }

    const hoverPreview = new WeakMap();

    function stopHoverPreview(card) {
      const animation = hoverPreview.get(card);
      if (animation) animation.cancel();
      hoverPreview.delete(card);
      const image = card.querySelector('.media-scroll img');
      if (image) image.style.transform = '';
    }

    function startHoverPreview(card) {
      if (!card.classList.contains('is-pan-ready')) return;
      const image = card.querySelector('.media-scroll img');
      const scroller = card.querySelector('.media-scroll');
      if (!image || !scroller) return;
      stopHoverPreview(card);

      const overflow = Math.max(0, image.getBoundingClientRect().height - scroller.getBoundingClientRect().height);
      if (overflow <= 24) return;
      const duration = Math.min(78000, Math.max(22000, overflow * 32));
      const animation = image.animate([
        { transform: 'translateY(0)' },
        { transform: `translateY(-${overflow}px)` }
      ], {
        duration,
        easing: 'linear',
        fill: 'forwards'
      });
      hoverPreview.set(card, animation);
    }

      </div>
      <div class="admin-group">
        <div class="admin-section-heading" style="margin-bottom:10px;"><h3>工作分类</h3><p>${projectAssetCount(project)} 项素材 / ${(project.groups || []).length} 个分类。只允许 1、2、4、6 格和长页浏览器。</p></div>
        ${(project.groups || []).map((group, groupIndex) => `<section class="admin-archive-group" data-group-id="${escapeHtml(group.id || '')}">
          <div class="admin-archive-row">
            <div><strong>${escapeHtml(group.index || String(groupIndex + 1).padStart(2, '0'))} · ${escapeHtml(group.title || group.id)}</strong><small>${groupAssetCount(group)} 项 / ${(group.series || []).length} 个系列</small></div>
            <div><button class="admin-btn" type="button" data-group-move="-1" title="分类上移">↑</button><button class="admin-btn" type="button" data-group-move="1" title="分类下移">↓</button></div>
          </div>
          <div class="admin-grid" style="margin-top:10px;">
            <label class="admin-field">分类名称<input data-group-field="title" value="${escapeHtml(group.title || '')}"></label>
            <label class="admin-field">英文标签<input data-group-field="label" value="${escapeHtml(group.label || '')}"></label>
          </div>
          ${(group.series || []).map((series, index) => archiveSeriesAdmin(project, group, series, index)).join('')}
        </section>`).join('')}
      </div>`;
    }

    function renderProjectEditor() {
      const project = selectedProject();
      if (!project) return renderThemeEditor();
      if (Array.isArray(project.groups)) return renderArchiveProjectEditor(project);
      adminEditor.innerHTML = `<div class="admin-section-heading">
        <h3>${escapeHtml(project.title || project.id)}</h3>
        <p>编辑后会立即影响前台，保存草稿写入本机浏览器，导出网页会把数据写回同一个 HTML。</p>
      </div>
      <div class="admin-group">
        <div class="admin-actions" style="margin-bottom:12px;">
          <button class="admin-btn" type="button" data-project-move="-1">项目上移</button>
          <button class="admin-btn" type="button" data-project-move="1">项目下移</button>
        </div>
        <div class="admin-grid">
          <label class="admin-field">ID<input value="${escapeHtml(project.id)}" disabled></label>
          <label class="admin-field">状态<select data-project-field="status">
            ${['ready','draft','placeholder'].map(status => `<option value="${status}" ${project.status === status ? 'selected' : ''}>${status}</option>`).join('')}
          </select></label>
          <label class="admin-field">标题<input data-project-field="title" value="${escapeHtml(project.title || '')}"></label>
          <label class="admin-field">年份<input data-project-field="year" value="${escapeHtml(project.year || '')}"></label>
          <label class="admin-field">职责<input data-project-field="role" value="${escapeHtml(project.role || '')}"></label>
          <label class="admin-field">标签<input data-project-field="tags" value="${escapeHtml(project.tags || '')}"></label>
        </div>
        <label class="admin-field" style="margin-top:10px;">项目描述<textarea data-project-field="desc">${escapeHtml(project.desc || '')}</textarea></label>
        <label class="admin-field" style="margin-top:10px;">职责说明<textarea data-project-field="roleSummary">${escapeHtml(project.roleSummary || '')}</textarea></label>
      </div>
      ${projectCaseFields(project)}
      <div class="admin-group">
        <div class="admin-section-heading" style="margin-bottom:10px;">
          <h3>素材顺序、显示层级与画幅</h3>
          <p>广告不再按用途分组。使用上下按钮调整同一章节内的观看顺序，用画幅选项稳定控制横版、方图、竖版或动效展示。</p>
        </div>
        <div class="asset-admin-list">
          ${assetEditorRows(project) || '<p style="color:#888;">暂无素材。</p>'}
        </div>
      </div>`;
    }

    function assetAdminRow(asset, index) {
      const src = mediaSrc(asset);
      const thumb = asset.kind === 'video'
        ? `<video src="${escapeHtml(src)}" muted playsinline preload="metadata"></video>`
        : `<img src="${escapeHtml(src)}" alt="">`;
      return `<article class="asset-admin-row" data-asset-id="${escapeHtml(asset.id)}">
        <div class="asset-admin-thumb">${thumb}</div>
        <div>
          <small>${index + 1}. ${escapeHtml(asset.outputName || asset.id)}</small>
          <div class="asset-mini-grid">
            <input data-asset-field="categoryTitle" value="${escapeHtml(asset.categoryTitle || '')}" aria-label="分类">
            <input data-asset-field="useRole" value="${escapeHtml(asset.useRole || '')}" aria-label="用途">
            ${asset.caseSection ? `<select data-asset-field="displayMode" aria-label="显示层级">
              ${['case','archive','hidden'].map(mode => `<option value="${mode}" ${asset.displayMode === mode ? 'selected' : ''}>${mode === 'case' ? '案例正文' : mode === 'archive' ? '完整归档' : '隐藏'}</option>`).join('')}
            </select>` : ''}
            ${asset.caseSection === 'campaign-system' ? `<select data-asset-field="campaignFormat" aria-label="广告画幅">
              ${Object.entries(CAMPAIGN_FORMAT_OPTIONS).map(([format, label]) => `<option value="${escapeHtml(format)}" ${(asset.campaignFormat || 'auto') === format ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}
            </select>` : ''}
            <button type="button" data-move="-1">↑</button>
            <button type="button" data-move="1">↓</button>
          </div>
        </div>
      </article>`;
    }

    function renderAdmin() {
      renderAdminNav();
      if (activeAdmin === 'theme') renderThemeEditor();
      else renderProjectEditor();
    }

    function renderAll() {
      applyTheme();
      renderNav();
      renderProjects();
      if (adminPanel.classList.contains('open')) renderAdmin();
    }

    function saveDraft() {
      localStorage.setItem(draftKey, JSON.stringify(state));
      showToast('草稿已保存到本机浏览器');
    }

    function clearDraft() {
      localStorage.removeItem(draftKey);
      state = structuredClone(seedData);
      state.theme = { ...defaultTheme, ...(state.theme || {}) };
      activeAdmin = 'theme';
      renderAll();
      showToast('已恢复生成数据');
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const link = document.createElement('a');
      const objectUrl = URL.createObjectURL(blob);
      link.href = objectUrl;
      link.download = filename;
      link.hidden = true;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }

    function exportSafeData(value) {
      if (Array.isArray(value)) return value.map(exportSafeData);
      if (!value || typeof value !== 'object') {
        return typeof value === 'string' && /(?:^|\s)[a-z]:[\\/]/i.test(value) ? '' : value;
      }
      const blockedKeys = new Set(['sourcePath', 'outputPath', 'psdSourcePath', 'path']);
      return Object.fromEntries(Object.entries(value)
        .filter(([key]) => !blockedKeys.has(key))
        .map(([key, item]) => [key, exportSafeData(item)]));
    }

    function buildExportHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('#admin-panel')?.classList.remove('open');
      clone.querySelector('#admin-panel')?.setAttribute('inert', '');
      clone.querySelector('#admin-panel')?.setAttribute('aria-hidden', 'true');
      clone.querySelector('.admin-toast')?.classList.remove('show');
      clone.querySelector('.archive-lightbox')?.remove();
      clone.querySelector('body').style.overflow = '';
      clone.querySelectorAll('[data-lightbox-bound]').forEach(el => el.removeAttribute('data-lightbox-bound'));
      const seedScript = clone.querySelector('#work-data-seed, script[src*="work-data-seed-"]');
      if (seedScript) {
        const inlineSeed = document.createElement('script');
        inlineSeed.id = 'work-data-seed';
        inlineSeed.textContent = `window.WORK_ARCHIVE_DATA = ${JSON.stringify(exportSafeData(state), null, 2).replace(/<\//g, '<\\/')};`;
        seedScript.replaceWith(inlineSeed);
      }
      return '<!doctype html>\n' + clone.outerHTML;
    }
    window.buildWorkExportHtml = buildExportHtml;

    function exportSite() {
      const html = buildExportHtml();
      downloadFile('work_archive_v031_export.html', html, 'text/html;charset=utf-8');
      showToast('已导出单文件 HTML');
    }

    function tryOpenAdminPanel() {
      if (window.matchMedia('(max-width: 768px)').matches) return;
      adminPanel.classList.add('open');
      renderAdmin();
    }

    function closeAdminPanel() {
      adminPanel.classList.remove('open');
    }

    document.addEventListener('click', event => {
      const targetButton = event.target.closest('[data-admin-target]');
      if (targetButton) {
        activeAdmin = targetButton.dataset.adminTarget;
        renderAdmin();
      }
    });

    adminEditor.addEventListener('input', event => {
      const themeKey = event.target.dataset.themeKey;
      if (themeKey) {
        state.theme[themeKey] = event.target.value;
        applyTheme();
        adminEditor.querySelectorAll(`[data-theme-key="${themeKey}"]`).forEach(input => {
          if (input !== event.target) input.value = event.target.value;
        });
        return;
      }
      const field = event.target.dataset.projectField;
      const project = selectedProject();
      if (field && project) {
        project[field] = event.target.value;
        renderNav();
        renderProjects();
        renderAdminNav();
        return;
      }
      const groupField = event.target.dataset.groupField;
      const groupRow = event.target.closest('[data-group-id]');
      const group = project?.groups?.find(item => item.id === groupRow?.dataset.groupId);
      if (groupField && group) {
        group[groupField] = event.target.value;
        renderProjects();
        return;
      }
      const seriesField = event.target.dataset.seriesField;
      const seriesRow = event.target.closest('[data-series-id]');
      const series = group?.series?.find(item => item.id === seriesRow?.dataset.seriesId);
      if (seriesField && series) {
        series[seriesField] = seriesField === 'layout' && event.target.value !== 'pagecase'
          ? Number(event.target.value)
          : event.target.value;
        renderProjects();
        return;
      }
      const itemField = event.target.dataset.itemField;
      const itemRow = event.target.closest('[data-item-id]');
      const item = series?.items?.find(entry => entry.id === itemRow?.dataset.itemId);
      if (itemField && item) {
        item[itemField] = itemField === 'hidden' ? event.target.value === 'true' : event.target.value;
        renderProjects();
        if (itemField === 'hidden') {
          renderAdminNav();
          renderProjectEditor();
        }
        return;
      }
      const assetField = event.target.dataset.assetField;
      const assetRow = event.target.closest('[data-asset-id]');
      const asset = selectedProject()?.assets?.find(item => item.id === assetRow?.dataset.assetId);
      if (assetField && asset) {
        asset[assetField] = event.target.value;
        renderProjects();
        if (assetField === 'displayMode') renderProjectEditor();
      }
    });

    adminEditor.addEventListener('click', event => {
      const action = event.target.closest('button');
      if (!action) return;
      const project = selectedProject();
      const groupRow = action.closest('[data-group-id]');
      const group = project?.groups?.find(item => item.id === groupRow?.dataset.groupId);
      const seriesRow = action.closest('[data-series-id]');
      const series = group?.series?.find(item => item.id === seriesRow?.dataset.seriesId);
      const itemRow = action.closest('[data-item-id]');

      const groupMove = Number(action.dataset.groupMove || 0);
      if (groupMove && project?.groups && group) {
        const index = project.groups.findIndex(item => item.id === group.id);
        const nextIndex = index + groupMove;
        if (nextIndex >= 0 && nextIndex < project.groups.length) {
          const [current] = project.groups.splice(index, 1);
          project.groups.splice(nextIndex, 0, current);
          project.groups.forEach((item, groupIndex) => { item.index = String(groupIndex + 1).padStart(2, '0'); });
          renderProjects();
          renderAdminNav();
          renderProjectEditor();
          showToast('分类顺序已更新');
        }
        return;
      }

      const seriesMove = Number(action.dataset.seriesMove || 0);
      if (seriesMove && group?.series && series) {
        const index = group.series.findIndex(item => item.id === series.id);
        const nextIndex = index + seriesMove;
        if (nextIndex >= 0 && nextIndex < group.series.length) {
          const [current] = group.series.splice(index, 1);
          group.series.splice(nextIndex, 0, current);
          renderProjects();
          renderProjectEditor();
          showToast('系列顺序已更新');
        }
        return;
      }

      const itemMove = Number(action.dataset.itemMove || 0);
      if (itemMove && series?.items && itemRow) {
        const index = series.items.findIndex(item => item.id === itemRow.dataset.itemId);
        const nextIndex = index + itemMove;
        if (index >= 0 && nextIndex >= 0 && nextIndex < series.items.length) {
          const [current] = series.items.splice(index, 1);
          series.items.splice(nextIndex, 0, current);
          renderProjects();
          renderProjectEditor();
          showToast('素材顺序已更新');
        }
        return;
      }

      const projectMove = Number(action.dataset.projectMove || 0);
      if (projectMove) {
        const projectIndex = state.projects.findIndex(project => project.id === activeAdmin);
        const nextProjectIndex = projectIndex + projectMove;
        if (projectIndex >= 0 && nextProjectIndex >= 0 && nextProjectIndex < state.projects.length) {
          const [project] = state.projects.splice(projectIndex, 1);
          state.projects.splice(nextProjectIndex, 0, project);
          state.projects.forEach((item, index) => { item.sortOrder = index + 1; });
          renderAll();
          showToast('项目顺序已更新');
        }
        return;
      }
      const move = Number(action.dataset.move || 0);
      const assetRow = action.closest('[data-asset-id]');
      if (!move || !assetRow || !project?.assets) return;
      const index = project.assets.findIndex(asset => asset.id === assetRow.dataset.assetId);
      if (index < 0) return;
      const current = project.assets[index];
      const currentMode = current.displayMode || 'case';
      const cohort = project.assets.filter(asset =>
        asset.caseSection === current.caseSection && (asset.displayMode || 'case') === currentMode
      );
      const cohortIndex = cohort.findIndex(asset => asset.id === current.id);
      const nextCohortIndex = cohortIndex + move;
      if (cohortIndex < 0 || nextCohortIndex < 0 || nextCohortIndex >= cohort.length) return;
      const targetIndex = project.assets.findIndex(asset => asset.id === cohort[nextCohortIndex].id);
      project.assets[index] = project.assets[targetIndex];
      project.assets[targetIndex] = current;
      renderProjects();
      renderProjectEditor();
    });

    document.getElementById('admin-close').addEventListener('click', closeAdminPanel);
    document.getElementById('save-draft').addEventListener('click', saveDraft);
    document.getElementById('clear-draft').addEventListener('click', clearDraft);
    document.getElementById('export-html').addEventListener('click', exportSite);

    window.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'e') {
        event.preventDefault();
        if (window.matchMedia('(max-width: 768px)').matches) return;
        adminPanel.classList.toggle('open');
        renderAdmin();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        exportSite();
      }
      if (event.key === 'Escape') {
        const lightbox = document.querySelector('.archive-lightbox.is-open');
        if (lightbox) {
          lightbox.classList.remove('is-open');
          document.body.style.overflow = '';
        } else {
          closeAdminPanel();
        }
      }
    });

    document.addEventListener('touchstart', event => {
      if (event.touches.length > 1) return;
      const touch = event.touches[0];
      if (window.innerWidth - touch.clientX < 150 && window.innerHeight - touch.clientY < 150) {
        tapCount += 1;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 650);
        if (tapCount === 3) {
          tryOpenAdminPanel();
          tapCount = 0;
        }
      }
    }, { passive: true });

    document.addEventListener('mousemove', event => {
      cursor.style.left = `${event.clientX}px`;
      cursor.style.top = `${event.clientY}px`;
    });
    document.addEventListener('pointerenter', event => {
      const card = event.target.closest?.('.media-card');
      if (card) startHoverPreview(card);
    }, true);
    document.addEventListener('pointerleave', event => {
      const card = event.target.closest?.('.media-card');
      if (card) stopHoverPreview(card);
    }, true);
    document.addEventListener('error', event => {
      const media = event.target;
      if (media instanceof HTMLImageElement || media instanceof HTMLVideoElement) retryWorkMedia(media);
    }, true);
    window.addEventListener('resize', () => setupHoverPreview(projectMount));

    renderAll();
    if (params.get('admin') === '1') {
      tryOpenAdminPanel();
    }
    if (location.hash) {
      let hashAlignmentCancelled = false;
      const cancelHashAlignment = () => { hashAlignmentCancelled = true; };
      const alignInitialHash = () => {
        if (hashAlignmentCancelled || !location.hash) return;
        try {
          document.querySelector(location.hash)?.scrollIntoView({ block: 'start' });
        } catch (error) {
          console.warn('无法定位 Work 锚点：', location.hash);
        }
      };
      window.addEventListener('wheel', cancelHashAlignment, { passive: true, once: true });
      window.addEventListener('touchstart', cancelHashAlignment, { passive: true, once: true });
      [120, 650, 1400].forEach(delay => window.setTimeout(alignInitialHash, delay));
      window.addEventListener('load', () => window.setTimeout(alignInitialHash, 60), { once: true });
      document.fonts?.ready?.then(() => window.setTimeout(alignInitialHash, 40));
    }
  </script>
</body>
</html>
